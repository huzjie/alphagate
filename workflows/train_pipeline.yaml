# 工作流：两阶段 RL 训练流水线
name: train_pipeline
description: "两阶段 RL 训练流水线"
schedule: daily
steps:
  - name: fetch
    tool: MarketDataHub.get_prices
  - name: regime
    tool: RegimeBuilder.build
  - name: gate
    tool: SemanticGate.decide
  - name: export
    tool: Exporter.to_json
output:
  format: json
  path: reports/train_pipeline.json
