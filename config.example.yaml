# AlphaGate 配置示例（复制为 config.yaml 使用）
model:
  backend: mock            # mock / transformers / vllm / openai
  model_id: FinStep-AI/Alpha-R1
  temperature: 0.1
  max_tokens: 2048

gate:
  embedder: hash           # hash / bow / tfidf
  similarity_threshold: 0.20
  top_k: 5
  max_active_strategies: 6

data:
  source: mock             # mock / csv / akshare
  cache_dir: ~/.cache/alphagate
  universe:
    - 600000.SH
    - 000001.SZ
    - 600519.SH

backtest:
  initial_capital: 1000000.0
  benchmark: 000300.SH
  rebalance_freq: monthly
  cost_rate: 0.0003

serving:
  host: 0.0.0.0
  port: 8000
