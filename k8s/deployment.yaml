apiVersion: apps/v1
kind: Deployment
metadata:
  name: alphagate
  labels:
    app: alphagate
spec:
  replicas: 2
  selector:
    matchLabels:
      app: alphagate
  template:
    metadata:
      labels:
        app: alphagate
    spec:
      containers:
        - name: alphagate
          image: alphagate:latest
          ports:
            - containerPort: 8000
          env:
            - name: ALPHAGATE_DATA_SOURCE
              value: mock
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
