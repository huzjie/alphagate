version: "3.9"
services:
  alphagate:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ALPHAGATE_DATA_SOURCE=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
