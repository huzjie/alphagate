[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alphagate"
version = "1.0.0"
description = "语义门控金融推理与资产配置平台（Alpha-R1 范式）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "AlphaGate Contributors" }]
keywords = ["finance", "semantic-gating", "rl", "asset-allocation", "llm", "alpha-r1"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy>=1.24",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
akshare = ["akshare>=1.14"]
dev = ["pytest>=7.0", "ruff>=0.3", "mypy>=1.8"]
all = ["akshare>=1.14", "pytest>=7.0"]

[project.scripts]
alphagate = "alphagate.cli:main"

[tool.setuptools.packages.find]
include = ["alphagate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
